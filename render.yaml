# One Docker-built service for both the API and the built React site -
# main.py serves frontend/build itself once it exists (see the StaticFiles
# mount at the bottom of main.py), so there is nothing for a second, separate
# frontend service to do. One origin also means no CORS configuration is
# needed between them, same reasoning as scripts/serve-public.sh's local
# Tailscale Funnel setup.
#
# DATABASE_URL is intentionally `sync: false` - it is not committed here.
# Paste the Neon connection string into the Render dashboard for this
# service instead (Environment tab). Same for the Groq keys.
services:
  - type: web
    name: kayosha
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
